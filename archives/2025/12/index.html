    <script>
      window.THEME_CONFIG = {

    <!-- Apply theme immediately to prevent flash -->
    <script>
      (function() {
        var config = window.THEME_CONFIG;
        var THEME_KEY = 'theme-preference';
        var THEME_AUTO = 'auto';

        function getSystemTheme() {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return config.darkTheme;
          }
          return config.lightTheme;
        }

        function getStoredTheme() {
          try {
            return localStorage.getItem(THEME_KEY) || config.defaultMode;
          } catch (e) {
            return config.defaultMode;
          }
        }

        function getEffectiveTheme(preference) {
          if (preference === THEME_AUTO) {
            return getSystemTheme();
          }
          return preference;
        }

        var preference = getStoredTheme();
        var theme = getEffectiveTheme(preference);

        // Apply theme immediately before page renders
        if (theme && theme !== 'white') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
