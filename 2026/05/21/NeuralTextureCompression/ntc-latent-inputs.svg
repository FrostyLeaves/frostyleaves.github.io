<svg style="--diagram-background:#222426;--diagram-text:#e6e4e0;--diagram-accent:#f3b958;--diagram-teal:#4bc292;--diagram-blue:#009dff;--diagram-purple:#8867a5;--diagram-orange:#f3b958" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364"
     class="theme-diagram" data-theme-svg="1" role="img"
     aria-labelledby="ntc-latent-inputs-title ntc-latent-inputs-desc">
<title id="ntc-latent-inputs-title">FlightHelmet 特征数组与解码器输入</title>
<desc id="ntc-latent-inputs-desc">表格每行代表一个数组层，每列代表一个特征 mip。用于当前查询的两列分别将四个四分量采样结果写进输入向量。向量尾部是位置编码、两份 LOD 以及填充。下方色带的宽度与分量数成比例。</desc>
<style>
.theme-diagram {
  --d-bg: var(--diagram-background, #ffffff);
  --d-ink: var(--diagram-text, #383838);
  --d-accent: var(--diagram-accent, #2bbc8a);
  --d-muted: color-mix(in srgb, var(--d-ink) 68%, var(--d-bg));
  --d-border: color-mix(in srgb, var(--d-ink) 19%, var(--d-bg));
  --d-surface: color-mix(in srgb, var(--d-ink) 3%, var(--d-bg));
  --d-shadow: color-mix(in srgb, #000000 35%, var(--d-bg));
  --d-teal: var(--diagram-teal, color-mix(in srgb, var(--d-accent) 76%, var(--d-ink)));
  --d-blue: var(--diagram-blue, color-mix(in srgb, var(--d-accent) 28%, #6c91bc));
  --d-purple: var(--diagram-purple, color-mix(in srgb, var(--d-accent) 15%, #a18ab9));
  --d-orange: var(--diagram-orange, color-mix(in srgb, var(--d-accent) 10%, #d3a462));
  font-family: var(--diagram-font, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
}
.theme-diagram text { font-family: inherit; }
</style>
<defs>
  <marker id="ntc-latent-inputs-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="720" height="364" fill="var(--d-bg)"/>

<!-- Rows are array layers, columns are mip levels; each tile denotes one subresource. -->
<g font-size="26" fill="var(--d-ink)" text-anchor="middle">
  <text x="55" y="43">mip</text>
  <text x="137" y="43">0</text><text x="209" y="43">1</text>
  <text x="281" y="43">2</text><text x="353" y="43">3</text>
  <text x="425" y="43">4</text><text x="497" y="43">5</text>
  <text x="569" y="43">6</text><text x="641" y="43">7</text>
  <text x="55" y="83">层 0</text><text x="55" y="118">层 1</text>
  <text x="55" y="153">层 2</text><text x="55" y="188">层 3</text>
</g>
<rect x="101" y="58" width="576" height="140" rx="4" fill="var(--d-surface)" stroke="var(--d-border)" stroke-width="2"/>
<rect x="101" y="58" width="72" height="140" rx="3" fill="color-mix(in srgb, var(--d-blue) 27%, var(--d-bg))" stroke="var(--d-blue)" stroke-width="2"/>
<rect x="173" y="58" width="72" height="140" rx="3" fill="color-mix(in srgb, var(--d-teal) 27%, var(--d-bg))" stroke="var(--d-teal)" stroke-width="2"/>
<path d="M317 58v140 M389 58v140 M461 58v140 M533 58v140 M605 58v140 M245 93h432 M245 128h432 M245 163h432"
      fill="none" stroke="var(--d-border)" stroke-width="2"/>
<path d="M101 93h72 M101 128h72 M101 163h72" stroke="var(--d-blue)" fill="none" stroke-width="2"/>
<path d="M173 93h72 M173 128h72 M173 163h72" stroke="var(--d-teal)" fill="none" stroke-width="2"/>

<!-- A four-component lookup in each of the eight selected subresources. -->
<g fill="var(--d-blue)">
  <path id="ntc-latent-inputs-blue-sample" d="M120 71h6v8h-6z M129 71h6v8h-6z M138 71h6v8h-6z M147 71h6v8h-6z"/>
  <use href="#ntc-latent-inputs-blue-sample" y="35"/><use href="#ntc-latent-inputs-blue-sample" y="70"/><use href="#ntc-latent-inputs-blue-sample" y="105"/>
</g>
<g fill="var(--d-teal)">
  <path id="ntc-latent-inputs-teal-sample" d="M192 71h6v8h-6z M201 71h6v8h-6z M210 71h6v8h-6z M219 71h6v8h-6z"/>
  <use href="#ntc-latent-inputs-teal-sample" y="35"/><use href="#ntc-latent-inputs-teal-sample" y="70"/><use href="#ntc-latent-inputs-teal-sample" y="105"/>
</g>
<g fill="none" stroke-width="2.8" marker-end="url(#ntc-latent-inputs-arrow)">
  <path d="M137 202v49" stroke="var(--d-blue)"/>
  <path d="M209 202v24h146v25" stroke="var(--d-teal)"/>
</g>

<!-- 48 input slots. Fine marks in the two latent segments separate array layers. -->
<g stroke-width="2">
  <rect x="60" y="260" width="200" height="36" fill="color-mix(in srgb, var(--d-blue) 27%, var(--d-bg))" stroke="var(--d-blue)"/>
  <rect x="260" y="260" width="200" height="36" fill="color-mix(in srgb, var(--d-teal) 27%, var(--d-bg))" stroke="var(--d-teal)"/>
  <rect x="460" y="260" width="150" height="36" fill="color-mix(in srgb, var(--d-purple) 25%, var(--d-bg))" stroke="var(--d-purple)"/>
  <rect x="610" y="260" width="25" height="36" fill="color-mix(in srgb, var(--d-orange) 36%, var(--d-bg))" stroke="var(--d-orange)"/>
  <rect x="635" y="260" width="25" height="36" fill="var(--d-surface)" stroke="var(--d-muted)" stroke-dasharray="4 2"/>
  <path d="M110 260v36 M160 260v36 M210 260v36" stroke="var(--d-blue)"/>
  <path d="M310 260v36 M360 260v36 M410 260v36" stroke="var(--d-teal)"/>
  <path d="M510 260v36 M560 260v36" stroke="var(--d-purple)"/>
</g>
<g fill="var(--d-ink)" font-size="26" text-anchor="middle">
  <text x="160" y="333">mip 0 特征</text>
  <text x="360" y="333">mip 1 特征</text>
  <text x="522" y="333">位置编码</text>
  <text x="608" y="334">LOD</text>
  <text x="677" y="334">填充</text>
</g>
<path d="M622 297v9l-12 9 M648 297v9l24 9" stroke="var(--d-muted)" stroke-width="1.5" fill="none"/>
</svg>