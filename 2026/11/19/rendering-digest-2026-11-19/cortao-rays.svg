<path d="M300 258L155 86M300 258L430 76" stroke="var(--d-muted)" stroke-width="2" stroke-dasharray="6 7" fill="none"/>
<ellipse cx="204" cy="144" rx="32" ry="13" transform="rotate(-40 204 144)" fill="var(--d-orange)" opacity=".32"/>
<ellipse cx="390" cy="132" rx="27" ry="12" transform="rotate(36 390 132)" fill="var(--d-orange)" opacity=".32"/>
<ellipse cx="204" cy="144" rx="32" ry="13" transform="rotate(-40 204 144)" fill="none" stroke="var(--d-orange)" stroke-width="3"/>
<ellipse cx="390" cy="132" rx="27" ry="12" transform="rotate(36 390 132)" fill="none" stroke="var(--d-orange)" stroke-width="3"/>
